version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo "Installation / vérification de Java"
      - java -version
      - mvn -version

  pre_build:
    commands:
      - echo "Début du build Maven"

  build:
    commands:
      - echo "Compilation du projet..."
      - mvn clean package

  post_build:
    commands:
      - echo "Build terminé avec succès"
      - ls -lh target/

artifacts:
  files:
    - target/*.jar